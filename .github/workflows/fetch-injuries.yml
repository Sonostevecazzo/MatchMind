name: Update Serie A Injuries and Absences

on:
  schedule:
    # Run daily at 07:00 UTC and 15:30 UTC
    - cron: '0 7,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'injuries-sync'
  cancel-in-progress: false

jobs:
  update-injuries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Fetch and convert Serie A injuries
        run: python3 mobile/scripts/fetch-injuries.py

      - name: Commit and push updated injuries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/injuries-data.json
          if git diff --staged --quiet; then
            echo "No changes in injuries feed."
          else
            git commit -m "chore(injuries): update Serie A injuries and suspensions"
            git push origin main
          fi
