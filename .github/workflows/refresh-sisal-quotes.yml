name: Refresh Sisal quote snapshot

on:
  push:
    branches:
      - feat/phase-1-ux-navigation
    paths:
      - "mobile/sisal_quotes.py"
      - "mobile/requirements-sisal.txt"
      - ".github/workflows/refresh-sisal-quotes.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout the preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-1-ux-navigation
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF and HTML parsers
        run: python -m pip install -r mobile/requirements-sisal.txt
      - name: Read the official Sisal quote sheet
        run: python mobile/sisal_quotes.py --output mobile/sisal-quotes.json
      - name: Publish a changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- mobile/sisal-quotes.json; then
            echo "Sisal PDF unchanged; no commit needed."
          else
            git add mobile/sisal-quotes.json
            git commit -m "chore: refresh Sisal quote snapshot"
            git push origin HEAD:feat/phase-1-ux-navigation
          fi
