name: provider-live-smoke
on:
  push:
    paths:
      - '.github/workflows/provider-live-smoke.yml'
      - 'matchmind/live_smoke.py'
      - 'matchmind/providers/api_football.py'
      - 'pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
permissions:
  contents: read
jobs:
  provider-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Live provider coverage and endpoint smoke
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATCHMIND_LIVE_SMOKE_LEAGUE: ${{ vars.MATCHMIND_LIVE_SMOKE_LEAGUE || '135' }}
        run: python -m matchmind.live_smoke
