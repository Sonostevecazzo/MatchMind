name: provider-live-smoke
on:
  push:
    paths:
      - '.github/workflows/provider-live-smoke.yml'
      - 'matchmind/live_smoke.py'
      - 'matchmind/providers/api_football.py'
      - 'pyproject.toml'
  workflow_dispatch:
  schedule:
    - cron: "20 5 * * *"
permissions:
  contents: read
jobs:
  provider-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -e .
      - name: Check whether the private provider secret is configured
        id: secret
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          if [ -n "$API_FOOTBALL_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live provider smoke skipped::Add API_FOOTBALL_KEY as a repository Actions secret to enable live endpoint verification."
          fi
      - name: Live provider coverage and endpoint smoke
        if: steps.secret.outputs.configured == 'true'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          MATCHMIND_LIVE_SMOKE_LEAGUE: ${{ vars.MATCHMIND_LIVE_SMOKE_LEAGUE || '135' }}
        run: python -m matchmind.live_smoke
      - name: Explain skipped live verification
        if: steps.secret.outputs.configured != 'true'
        run: echo "Static CI passed; live provider verification remains blocked until API_FOOTBALL_KEY is stored privately in repository Actions secrets."