name: tests
on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest run for a branch/PR; stale runs waste runner time.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q matchmind
      - name: Run automated tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m matchmind.cli demo
