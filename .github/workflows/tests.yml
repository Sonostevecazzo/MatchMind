name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  python-tests:
    # Standard GitHub-hosted runner; ubuntu-slim is not reliably provisioned for this private repository.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q matchmind
      - name: Run automated tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m matchmind.cli demo
      - name: Validate smartphone PWA
        run: python mobile/check.py
