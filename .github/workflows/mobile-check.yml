name: Mobile PWA checks

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser scripts
        run: |
          node --check mobile/site-core.js
          node --check mobile/site-pages.js
          node --check mobile/rounds.js
          node --check mobile/elo.js
          node --check mobile/bets-engine.js
          node --check mobile/bets.js
          node --check mobile/live.js
          node --check mobile/sw.js
      - name: Check Cloudflare Pages Functions
        run: |
          node --input-type=module --check < mobile/functions/api/public-calendar.js
          node --input-type=module --check < mobile/functions/api/live-match.js
      - name: Test chronological round analysis and live data normalization
        run: node --test mobile/tests/rounds.test.mjs mobile/tests/live-match.test.mjs
      - name: Run complete PWA validation suite
        run: python mobile/check.py
      - name: Run complete PWA validation suite
        run: python mobile/check.py
