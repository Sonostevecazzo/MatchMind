name: Mobile PWA checks
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

# Keep only the newest run for a branch/PR; stale runs waste runner time.
concurrency:
  group: mobile-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # mobile/check.py runs the complete static PWA audit, JavaScript syntax
      # checks, Cloudflare Function checks, and every mobile unit-test suite.
      - name: Validate PWA and run mobile tests
        run: python mobile/check.py
