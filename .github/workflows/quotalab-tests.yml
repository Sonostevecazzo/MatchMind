name: QuotaLab engine checks
on:
  pull_request:
    paths:
      - "mobile/quotalab/**"
      - "mobile/scripts/sisal-matchmind.user.js"
      - ".github/workflows/quotalab-tests.yml"
  push:
    branches: [main]
    paths:
      - "mobile/quotalab/**"
      - "mobile/scripts/sisal-matchmind.user.js"
      - ".github/workflows/quotalab-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic engine tests
        run: node --test mobile/quotalab/tests/engine.test.mjs
      - name: Validate static application files
        run: |
          test -s mobile/quotalab/index.html
          test -s mobile/quotalab/app.js
          test -s mobile/quotalab/engine.js
          test -s mobile/quotalab/sw.js
          node --check mobile/quotalab/app.js
          node --check mobile/quotalab/engine.js
          node --check mobile/scripts/sisal-matchmind.user.js
