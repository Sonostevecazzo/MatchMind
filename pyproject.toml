[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matchmind"
version = "0.2.0"
description = "Private football data pipeline and transparent statistical modelling workbench"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "APScheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
matchmind = "matchmind.cli:main"

[tool.setuptools.packages.find]
include = ["matchmind*"]

[tool.setuptools.package-data]
matchmind = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]