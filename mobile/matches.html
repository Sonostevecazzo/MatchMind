<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090c11"><meta name="description" content="MatchMind · Football Intelligence"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./site.css"><title>MatchMind · Partite</title><script defer src="./site-core.js"></script><script defer src="./site-pages.js"></script></head>
<body data-page="matches" data-title="Partite" data-subtitle="Calendario, risultati e ricerca per squadra o giornata."><div id="siteHeader"></div><main class="page-wrap"><div class="page-intro"><div class="eyebrow">MATCHMIND / MATCHES</div><h1 id="pageTitle">Partite</h1><p id="pageSubtitle">Calendario, risultati e ricerca per squadra o giornata.</p></div>
<div class="panel panel-pad" style="margin-bottom:12px"><div class="grid two">
 <div class="field"><label for="matchSearch">Cerca squadra</label><input id="matchSearch" type="search" placeholder="Es. Inter, Milan, Roma…"></div>
 <div class="field"><label for="matchDate">Data</label><input id="matchDate" type="date"></div>
 <div class="field"><label for="matchTeam">Squadra</label><select id="matchTeam"><option value="">Tutte le squadre</option></select></div>
 <div class="field"><label for="matchRound">Giornata</label><select id="matchRound"><option value="">Tutte le giornate</option></select></div>
 <div class="field"><label for="matchSeason">Stagione</label><select id="matchSeason"><option value="current">Corrente</option><option value="previous">Precedente</option></select></div>
 </div><div class="filter-row" id="matchFilters"><button class="pill active" data-filter="upcoming" aria-pressed="true">In programma</button><button class="pill" data-filter="finished" aria-pressed="false">Risultati</button><button class="pill" data-filter="stale" aria-pressed="false">Da aggiornare</button><button class="pill" data-filter="all" aria-pressed="false">Tutte</button></div>
 <button class="ghost" id="clearMatchFilters">Azzera filtri</button></div>
 <section class="section"><div class="section-head"><div><h2 id="matchListTitle">In programma</h2><p id="matchListSummary">Partite disponibili nel calendario.</p></div></div><div id="matchList" class="fixture-list"><div class="loading-state">Caricamento…</div></div><div style="text-align:center;margin-top:12px"><button id="moreMatches" class="ghost" hidden>Carica altre partite</button></div></section><div class="status-line" id="globalStatus" aria-live="polite"></div><footer class="site-footer">MatchMind · Dati soggetti alla copertura delle fonti. Le analisi sono stime statistiche.</footer></main></body></html>
